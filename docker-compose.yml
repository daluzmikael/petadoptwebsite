services:
  backend:
    build: ./backend
    environment:
      PET_ADOPTION_ALLOWED_ORIGINS: http://localhost:3000
    ports:
      - "5000:5000"

  frontend:
    build: ./frontend
    environment:
      BROWSER: none
      REACT_APP_API_URL: http://localhost:5000
    depends_on:
      - backend
    ports:
      - "3000:3000"
