name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v3
        name: Checkout code
      - name: Initialize submodules
        run: |
          git submodule update --init --recursive
      - uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - name: Run linter
        run: |
          python -m pip install flake8
          python -m flake8 .

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - run: |
          pip install -r backend/requirements.txt
          pip install pytest requests
          python backend/init_db.py
          cd backend/tests
          pytest --maxfail=1 --disable-warnings -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: docker/setup-buildx-action@v2
      - run: docker build -t team16-backend ./backend
      - run: docker run -d -p 5000:5000 team16-backend
      - run: curl http://localhost:5000/api/users

  cleanup:
    runs-on: self-hosted
    steps:
      - name: Clean up repository
        run: |
          git reset --hard
          git clean -fdx
      - name: Ensure directory permissions
        run: |
          sudo chown -R $(whoami):$(whoami) /home/runner/work/CSE2102-Spring25-Team16
          sudo chmod -R 755 /home/runner/work/CSE2102-Spring25-Team16
