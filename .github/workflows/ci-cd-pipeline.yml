name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    name: Lint Python Code
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Initialize Git Submodules
        run: git submodule update --init --recursive

      - name: Set up Python 3.9
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      # Commented out pylint run step for now
      # - name: Install Pylint
      #   run: pip install pylint

      # - name: Run Pylint
      #   run: pylint **/*.py

  tests:
    name: Run Tests
    runs-on: self-hosted
    needs: lint

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python 3.9
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      # Commented out pytest run step for now
      # - name: Install Dependencies
      #   run: pip install -r requirements.txt

      # - name: Run Pytests
      #   run: pytest

  docker:
    name: Build and Test Docker Container
    runs-on: self-hosted
    needs: tests

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Docker Image
        run: docker build -t team16-backend ./backend

      - name: Stop and Remove Existing Docker Containers
        run: |
          CONTAINER_IDS=$(docker ps -aqf "ancestor=team16-backend")
          if [ -n "$CONTAINER_IDS" ]; then
            echo "Stopping and removing existing container(s)..."
            docker stop $CONTAINER_IDS
            docker rm -f $CONTAINER_IDS
          fi

      - name: Run Docker Container
        id: docker
        run: |
          echo "Starting the Docker container..."
          docker run -d -p 5001:5000 --name team16-backend team16-backend
          echo "Waiting a moment before checking the container..."
          sleep 10

      - name: Check Docker Logs
        run: |
          docker logs team16-backend

      - name: Check if API is running inside the container
        run: |
          docker exec team16-backend ps aux

      - name: Confirm Docker Port Mapping
        run: |
          docker ps --filter "name=team16-backend"

      - name: Wait for the container to be ready
        run: |
          echo "Waiting for the container to be ready..."
          timeout=0
          until curl -s http://${{ steps.docker_ip.outputs.container_ip }}:5001/api/users; do
            if [ $timeout -ge 60 ]; then
              echo "Timeout waiting for the container to respond after 60 seconds."
              exit 1
            fi
            echo "Waiting for container to respond..."
            sleep 5  # Retry every 5 seconds until the API responds
            timeout=$((timeout+5))
          done

      - name: Check Docker Container Status
        run: docker ps

      - name: Get Docker Container IP
        id: docker_ip
        run: |
          # Get the container ID of the running container
          CONTAINER_ID=$(docker ps -q --filter "name=team16-backend")
          
          # If no container is running, exit the script with an error message
          if [ -z "$CONTAINER_ID" ]; then
            echo "Error: No container found for team16-backend."
            exit 1
          fi

          # Get the container IP address
          CONTAINER_IP=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' $CONTAINER_ID)
          echo "::set-output name=container_ip::$CONTAINER_IP"

      - name: Test Docker API Endpoint
        run: |
          # Make the curl call more reliable by ensuring the container is ready
          echo "Testing API endpoint..."
          until curl -s http://${{ steps.docker_ip.outputs.container_ip }}:5001/api/users; do
            echo "Waiting for container to respond..."
            sleep 5  # Retry every 5 seconds until the API responds
          done

  cleanup:
    name: Cleanup Workspace
    runs-on: self-hosted
    needs: docker

    steps:
      - name: Clean Git Repository
        run: |
          git reset --hard
          git clean -fdx

      - name: Fix Directory Permissions
        run: |
          sudo chown -R $(whoami):$(whoami) /home/runner/work/CSE2102-Spring25-Team16
          sudo chmod -R 755 /home/runner/work/CSE2102-Spring25-Team16
